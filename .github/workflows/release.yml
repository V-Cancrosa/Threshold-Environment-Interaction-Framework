name: Release

# A release is published whenever main carries a module.json version that has
# no release yet. Bumping "version" in module.json is all it takes to ship.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Read version
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version module.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp manifest and download URLs
        if: steps.meta.outputs.exists == 'false'
        run: |
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg m "$REPO_URL/releases/latest/download/module.json" \
             --arg d "$REPO_URL/releases/download/${{ steps.meta.outputs.tag }}/threshold.zip" \
             '.manifest = $m | .download = $d' module.json > module.tmp
          mv module.tmp module.json
          cat module.json

      - name: Build package
        if: steps.meta.outputs.exists == 'false'
        run: |
          zip -r threshold.zip module.json README.md scripts styles lang profiles assets docs
          # Every module path referenced from profiles must be in the package.
          missing=0
          for path in $(grep -oh 'modules/threshold/[^"]*' profiles/*.json | sort -u) modules/threshold/docs/changelog.json modules/threshold/docs/guide.pl.html modules/threshold/docs/guide.en.html; do
            if ! unzip -l threshold.zip "${path#modules/threshold/}" >/dev/null; then
              echo "::error::Missing from package: ${path#modules/threshold/}"; missing=1
            fi
          done
          exit $missing

      # Not marked as prerelease on purpose: /releases/latest/ only resolves to
      # non-prerelease releases, and Foundry installs through that manifest URL.
      - name: Publish release
        if: steps.meta.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" module.json threshold.zip \
            --target "$GITHUB_SHA" \
            --title "Threshold ${{ steps.meta.outputs.tag }}" \
            --generate-notes
