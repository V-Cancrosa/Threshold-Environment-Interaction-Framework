name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version and download URL into module.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" \
             --arg m "$REPO_URL/releases/latest/download/module.json" \
             --arg d "$REPO_URL/releases/download/${GITHUB_REF_NAME}/threshold.zip" \
             '.version = $v | .manifest = $m | .download = $d' module.json > module.tmp
          mv module.tmp module.json
          cat module.json

      - name: Build package
        run: zip -r threshold.zip module.json README.md scripts styles lang profiles

      # Not marked as prerelease on purpose: /releases/latest/ only resolves to
      # non-prerelease releases, and Foundry installs through that manifest URL.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" module.json threshold.zip \
            --title "Threshold $GITHUB_REF_NAME" \
            --generate-notes
